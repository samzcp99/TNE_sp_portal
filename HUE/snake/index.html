<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game Enhanced</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--background-color, #000);
            color: var(--text-color, #fff);
            font-family: Arial, sans-serif;
            transition: background-color 1s;
        }
        canvas {
            border: 2px solid var(--text-color, #fff);
            background-color: var(--canvas-color, #111);
        }
        #score {
            margin-bottom: 10px;
            font-size: 24px;
        }
        #controls, #themeSelector {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button, select {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        #achievements {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .achievement {
            padding: 5px 10px;
            font-size: 14px;
            border: 1px solid #fff;
            border-radius: 5px;
            background-color: #333;
            color: #fff;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .achievement.unlocked {
            opacity: 1;
            background-color: #4caf50;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0 | High Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="controls">
        <button onclick="pauseGame()">Pause/Resume</button>
        <button onclick="nextDirection = { x: 0, y: -1 }">Up</button>
        <button onclick="nextDirection = { x: 0, y: 1 }">Down</button>
        <button onclick="nextDirection = { x: -1, y: 0 }">Left</button>
        <button onclick="nextDirection = { x: 1, y: 0 }">Right</button>
    </div>
    <div id="themeSelector">
        <label for="theme">Theme:</label>
        <select id="theme" onchange="changeTheme(this.value)">
            <option value="default">Default</option>
            <option value="dark">Dark</option>
            <option value="bright">Bright</option>
        </select>
    </div>
    <div id="achievements">
        <div id="achievement-10" class="achievement">Score 10 Points</div>
        <div id="achievement-50" class="achievement">Score 50 Points</div>
        <div id="achievement-100" class="achievement">Score 100 Points</div>
        <div id="achievement-avoid" class="achievement">Avoid Obstacles 10 Times</div>
        <div id="achievement-streak" class="achievement">Eat 5 Food in a Row</div>
        <div id="achievement-survive" class="achievement">Survive 5 Minutes</div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) }];
        let direction = { x: 1, y: 0 };
        let nextDirection = direction;
        let food = { x: 5, y: 5, color: 'red' };
        let gameOver = false;
        let paused = false;
        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        let obstacles = [{ x: 8, y: 8 }];
        let avoidCount = 0;
        let foodStreak = 0;
        let survivalTime = 0;
        
        const backgroundMusic = new Audio('background-music.mp3');
        const eatSound = new Audio('eat-sound.mp3');
        const achievementSound = new Audio('achievement-sound.mp3');

        function playMusic() {
            backgroundMusic.loop = true;
            backgroundMusic.play();
        }

        function updateScore() {
            document.getElementById('score').innerText = `Score: ${score} | High Score: ${highScore}`;
        }

        function checkAchievements() {
            if (score >= 10) {
                document.getElementById('achievement-10').classList.add('unlocked');
            }
            if (score >= 50) {
                document.getElementById('achievement-50').classList.add('unlocked');
            }
            if (score >= 100) {
                document.getElementById('achievement-100').classList.add('unlocked');
            }
            if (avoidCount >= 10) {
                document.getElementById('achievement-avoid').classList.add('unlocked');
            }
            if (foodStreak >= 5) {
                document.getElementById('achievement-streak').classList.add('unlocked');
            }
            if (survivalTime >= 300) {
                document.getElementById('achievement-survive').classList.add('unlocked');
            }
        }

        function animateEat() {
            canvas.style.transform = 'scale(1.05)';
            setTimeout(() => {
                canvas.style.transform = 'scale(1)';
            }, 200);
        }

        function updateBackgroundColor() {
            const hue = (score * 5) % 360;
            document.body.style.backgroundColor = `hsl(${hue}, 50%, 20%)`;
        }

        function drawRect(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * gridSize, y * gridSize, gridSize - 2, gridSize - 2);
        }

        function drawSnake() {
            snake.forEach((segment, index) => {
                const gradient = ctx.createLinearGradient(
                    segment.x * gridSize, segment.y * gridSize,
                    (segment.x + 1) * gridSize, (segment.y + 1) * gridSize
                );
                gradient.addColorStop(0, `hsl(${(index * 20) % 360}, 70%, 50%)`);
                gradient.addColorStop(1, 'black');
                ctx.fillStyle = gradient;
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
            });
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount),
                color: `hsl(${Math.random() * 360}, 100%, 50%)`
            };
        }

        function addObstacles() {
            if (score % 50 === 0 && score > 0) {
                obstacles.push({
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                });
            }
        }

        function pauseGame() {
            paused = !paused;
            if (!paused) gameLoop();
        }

        function changeTheme(theme) {
            const root = document.documentElement;
            if (theme === 'dark') {
                root.style.setProperty('--background-color', '#000');
                root.style.setProperty('--text-color', '#fff');
                root.style.setProperty('--canvas-color', '#111');
            } else if (theme === 'bright') {
                root.style.setProperty('--background-color', '#fff');
                root.style.setProperty('--text-color', '#000');
                root.style.setProperty('--canvas-color', '#eee');
            } else {
                root.style.setProperty('--background-color', '#000');
                root.style.setProperty('--text-color', '#fff');
                root.style.setProperty('--canvas-color', '#111');
            }
        }

        function update() {
            if (gameOver || paused) return;

            survivalTime++;
            checkAchievements();

            direction = nextDirection;

            const head = { 
                x: snake[0].x + direction.x, 
                y: snake[0].y + direction.y 
            };

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount ||
                snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver = true;
                alert('Game Over! Press OK to restart.');
                location.reload();
            }

            if (obstacles.some(obstacle => obstacle.x === head.x && obstacle.y === head.y)) {
                avoidCount++;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                eatSound.play();
                score += 10;
                foodStreak++;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('highScore', highScore);
                }
                updateScore();
                animateEat();
                updateBackgroundColor();
                spawnFood();
                addObstacles();
            } else {
                foodStreak = 0;
                snake.pop();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawRect(food.x, food.y, food.color);
            obstacles.forEach(obstacle => drawRect(obstacle.x, obstacle.y, 'gray'));
            drawSnake();
        }

        function gameLoop() {
            if (!paused) {
                update();
                draw();
                if (!gameOver) setTimeout(gameLoop, Math.max(100, 50));
            }
        }

        window.addEventListener('keydown', e => {
            if (e.key === ' ') pauseGame();
            switch (e.key) {
                case 'ArrowUp': if (direction.y === 0) nextDirection = { x: 0, y: -1 }; break;
                case 'ArrowDown': if (direction.y === 0) nextDirection = { x: 0, y: 1 }; break;
                case 'ArrowLeft': if (direction.x === 0) nextDirection = { x: -1, y: 0 }; break;
                case 'ArrowRight': if (direction.x === 0) nextDirection = { x: 1, y: 0 }; break;
            }
        });

        playMusic();
        spawnFood();
        gameLoop();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麻将游戏</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="game">
    <h1>麻将游戏</h1>
    <div id="wall"></div>
    <div id="player-hand"></div>
    <div id="last-drawn-container">
      <div id="last-drawn-tile"></div>
    </div>
    <button id="shuffle-button">洗牌</button>
    <button id="draw-button" style="display:none;">摸牌</button>
    <button id="discard-button" style="display:none;">出牌</button>
    <button id="pong-button" style="display:none;">碰牌</button>
    <button id="kong-button" style="display:none;">杠牌</button>
    <button id="chi-button" style="display:none;">吃牌</button>
    <button id="hu-button" style="display:none;">胡牌</button>
  </div>
  <script src="script.js"></script>
</body>

</html>

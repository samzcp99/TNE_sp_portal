# Match the original external request, not internal directory index resolution.
map $request_uri $canonical_page_path {
    default "";
    ~*^/accounts_info\.html(?:\?|$) /account/;
    ~*^/about\.html(?:\?|$) /about/;
    ~*^/snake\.html(?:\?|$) /snake/;
    ~*^/mahjong/majong\.html(?:\?|$) /mahjong/;
    ~*^/index\.html(?:\?|$) /;
    ~*^/account/index\.html(?:\?|$) /account/;
    ~*^/about/index\.html(?:\?|$) /about/;
    ~*^/tools/index\.html(?:\?|$) /tools/;
    ~*^/tools/pswd/index\.html(?:\?|$) /tools/pswd/;
    ~*^/support/index\.html(?:\?|$) /support/;
    ~*^/snake/index\.html(?:\?|$) /snake/;
    ~*^/mahjong/index\.html(?:\?|$) /mahjong/;
}

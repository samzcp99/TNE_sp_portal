# Learning site on the new public domain. HTTP challenge stays available for renewal.
server {
    listen 80;
    listen [::]:80;
    server_name sp.samzhao.cloud;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt-ip;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://sp.samzhao.cloud$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sp.samzhao.cloud;
    ssl_certificate /etc/letsencrypt/live/sp.samzhao.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sp.samzhao.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/sit-portal.locations.conf;
}

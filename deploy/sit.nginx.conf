# Domain links remain valid and lead to the IP-based site.
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name sit.samzhao.cloud;
    ssl_certificate /etc/letsencrypt/live/sit.samzhao.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sit.samzhao.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    return 301 https://47.95.144.1$request_uri;
}
server {
    listen 80;
    listen [::]:80;
    server_name sit.samzhao.cloud;
    location / { return 301 https://47.95.144.1$request_uri; }
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.95.144.1;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt-ip;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://47.95.144.1$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 47.95.144.1;
    ssl_certificate /etc/letsencrypt-ip/live/server-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-ip/live/server-ip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/sit-portal.locations.conf;
}

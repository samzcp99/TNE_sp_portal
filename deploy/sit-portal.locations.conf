root /var/www/sit.samzhao.cloud/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    location / { try_files $uri $uri/ =404; }
    location = /accounts_info.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
    }
    location = /api/account-lookup {
        limit_req zone=sit_lookup burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        access_log off;
        add_header Cache-Control "no-store" always;
    }
    location /api/ { return 404; }
    location ~ /\. { deny all; }
    location ~* \.(pem|key|md)$ { deny all; }
